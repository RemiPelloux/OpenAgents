name: OpenOS Runtime Matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-worker:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: OpenAgents
      - name: Require private OpenOS checkout token
        shell: bash
        env:
          OPENOS_SUBMODULES_PAT: ${{ secrets.OPENOS_SUBMODULES_PAT }}
        run: |
          if [ -z "$OPENOS_SUBMODULES_PAT" ]; then
            echo "::error::OPENOS_SUBMODULES_PAT is required to check out RemiPelloux/OpenOS"
            exit 1
          fi
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: RemiPelloux/OpenOS
          path: OpenContract
          token: ${{ secrets.OPENOS_SUBMODULES_PAT }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: OpenOS worker tests (zero skips)
        working-directory: OpenAgents
        run: cargo test -p openagents-worker
