[package]
name = "openagents-worker"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "openagents-worker"
path = "src/main.rs"

[[bin]]
name = "openagents-sandbox"
path = "src/sandbox.rs"

[dependencies]
anyhow = "1"
async-trait = ">=0.1,<0.2"
async-stream = "0.3"
axum = "0.8"
base64 = ">=0.22,<0.23"
chrono = { version = "0.4", features = ["serde"] }
contract-core = { path = "../../../OpenContract/crates/contract-core" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
scraper = ">=0.24,<0.25"
fs2 = ">=0.4,<0.5"
libc = ">=0.2,<0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "fs", "signal", "time", "sync", "io-util", "net"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
tempfile = ">=3,<4"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }
url = ">=2,<3"
urlencoding = ">=2,<3"
zeroize = ">=1,<2"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"
