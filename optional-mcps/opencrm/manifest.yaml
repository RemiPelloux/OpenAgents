manifest_version: 1

name: opencrm
description: OpenCRM commercial intelligence — hot leads, contact enrichment, staged writes.
source: OpenOS OpenCRM

transport:
  type: stdio
  command: pnpm
  args:
    - exec
    - tsx
    - apps/mcp-server/src/index.ts
  cwd: "${OPENOS_ROOT}/OpenCRM"

post_install: |
  Ensure OpenCRM API is running on port 3010:
    cd OpenCRM && docker compose up -d postgres api

  Set OPENCRM_API_URL=http://localhost:3010 in ~/.openagents/.env

  Core tools: get_customer_context, list_hot_leads, search_contacts, create_contact,
  enrich_contact, list_decision_makers, list_contacts_needing_enrichment,
  propose_crm_update, create_account, update_account, …

  Skills: opencrm-sales-followup, opencrm-contact-enrichment
